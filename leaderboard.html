<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1117">

<title>SWE-Milestone · Leaderboard</title>
<meta name="description" content="Compact leaderboard — coding agents on continuous software evolution.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #2d333b;
    --border: #373e47;
    --border-strong: #444c56;
    --heading: #ecf2f8;
    --text: #cdd9e5;
    --muted: #98a5b3;
    --faint: #768390;
    --accent: #57ab5a;
    --accent-soft: rgba(87, 171, 90, 0.14);
    --sans: "Roboto", -apple-system, "Segoe UI", sans-serif;
    --mono: "Roboto Mono", ui-monospace, "SF Mono", monospace;
    --maxw: 1080px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
  html { background: var(--bg); color-scheme: dark; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--heading); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }

  /* ---- header ---- */
  .lbx-head { border-bottom: 1px solid var(--border); }
  .lbx-head-in { display: flex; align-items: baseline; justify-content: space-between; height: 60px; }
  .lbx-title {
    font-family: "Space Grotesk", var(--sans); font-size: 16px; font-weight: 700;
    color: var(--heading); letter-spacing: -0.01em;
  }
  .lbx-title span { color: var(--faint); font-weight: 600; }
  .lbx-back { font-family: var(--mono); font-size: 12px; color: var(--muted); transition: color .15s; }
  .lbx-back:hover { color: var(--heading); }

  main { padding: 28px 0 60px; }
  .lbx-sub { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin: 0 0 16px; }

  /* ---- table (compact) ---- */
  table { width: 100%; border-collapse: collapse; }
  #lb-table { table-layout: fixed; }
  thead th {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--text);
    text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
  }
  #lb-table th.ctr, #lb-table td.ctr { text-align: center; }
  tbody td {
    padding: 6px 10px; border-bottom: 1px solid var(--border);
    font-size: 13.5px; vertical-align: middle;
  }
  tbody tr { transition: background 0.12s ease; }
  tbody tr:hover { background: rgba(177, 186, 196, 0.06); }

  /* rank */
  td.rank { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--faint); }
  tr.top td.rank { color: var(--accent); font-weight: 700; }
  .rank-medal { font-size: 16px; line-height: 1; }

  /* model + agent on one line */
  td.model { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.model .m-name { font-weight: 700; font-size: 13.5px; color: var(--heading); letter-spacing: -0.01em; }
  td.model .m-scaffold { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: 8px; }
  td.model .m-logo { width: 16px; height: 16px; object-fit: contain; margin-right: 8px; vertical-align: -3px; }
  td.model .m-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; }

  /* numeric values */
  td.num { font-size: 13.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  th.keycol, td.keycol { background: rgba(177, 186, 196, 0.05); }
  tbody tr:hover td.keycol { background: rgba(177, 186, 196, 0.10); }
  td.num.keycol { color: var(--heading); }
  td.num.t1 { color: #57ab5a; }
  td.num.t2 { color: #83c586; }
  td.num.t3 { color: #b3ddb5; }

  /* score column — long bar that wraps the number */
  td.score-cell { padding: 4px 12px; }
  .scorebar {
    position: relative; display: block; height: 24px;
    background: var(--border); overflow: hidden;
  }
  .scorebar > i {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: rgba(87, 171, 90, 0.38);
  }
  tr.top .scorebar > i { background: rgba(87, 171, 90, 0.55); }
  .scoreval {
    position: relative; z-index: 2; display: inline-block;
    padding-left: 10px; line-height: 24px;
    font-weight: 700; font-size: 13.5px; color: var(--heading);
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }

  /* column widths */
  #lb-table th[data-key="rank"], #lb-table td.rank { width: 42px; }
  #lb-table th[data-key="model"], #lb-table td.model { width: 320px; }
  #lb-table th[data-key="score"], #lb-table td.score-cell { width: 210px; }

  /* sortable headers */
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--heading); }
  thead th.active { color: var(--heading); }
  thead th.ctr { position: relative; }
  thead th .sarrow { color: var(--accent); }
  thead th .sarrow:not(:empty) { margin-left: 3px; }
  thead th.ctr .sarrow { position: absolute; top: 50%; right: 3px; transform: translateY(-50%); margin: 0; }

  /* header hover tooltip */
  .tip-popup {
    position: fixed; transform: translate(-50%, -100%);
    background: var(--surface); color: var(--heading);
    border: 1px solid var(--border-strong); padding: 8px 13px;
    font-family: var(--sans); font-size: 12.5px; font-weight: 400; line-height: 1.5;
    max-width: 280px; white-space: normal; text-align: left; letter-spacing: 0; text-transform: none;
    pointer-events: none; z-index: 9999; opacity: 0; transition: opacity .12s;
    box-shadow: 0 8px 24px rgba(1, 4, 9, 0.6);
  }
  .tip-popup.show { opacity: 1; }
</style>
</head>
<body>
<header class="lbx-head">
  <div class="wrap lbx-head-in">
    <span class="lbx-title">SWE-Milestone <span>· Leaderboard</span></span>
    <a class="lbx-back" href="/">← Full site</a>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="lbx-sub">Compact view · click any column to sort · hover a header for its definition</p>
    <table id="lb-table">
      <thead><tr id="lb-head"></tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
  </div>
</main>

<script>
(function () {
  const DATA = window.SITE_DATA || { records: [], logos: {} };
  const RECORDS = DATA.records || [];
  const LOGOS = DATA.logos || {};
  if (!RECORDS.length) return;

  const LB_COLS = [
    { key: 'rank',      label: '#',           num: false, fmt: r => String(r.rank) },
    { key: 'model',     label: 'Model',       num: false },
    { key: 'score',     label: 'Score %',     num: true, hero: true, dir: 'max', tip: 'F1 of Precision and Recall. Balances fixing required tests and avoiding regressions.', fmt: r => r.score.toFixed(2) },
    { key: 'resolve',   label: 'Resolve %',   num: true, hero: true, dir: 'max', tip: '% of milestones fully resolved, where all required tests pass with no regressions.', fmt: r => r.resolve.toFixed(2) },
    { key: 'precision', label: 'Precision %', num: true, dir: 'max', tip: 'Ratio of bugs fixed without breaking existing tests. Higher means cleaner changes.', fmt: r => r.precision.toFixed(2) },
    { key: 'recall',    label: 'Recall %',    num: true, dir: 'max', tip: 'Ratio of required test cases successfully fixed. Higher means the agent addresses more of the required changes.', fmt: r => r.recall.toFixed(2) },
    { key: 'cost',      label: 'Cost $',      num: true, dir: 'min', tip: 'Average API cost per evolution range ($)', fmt: r => r.cost.toFixed(2) },
    { key: 'out_tok_k', label: 'Out Tok K',   num: true, dir: 'min', tip: 'Average output tokens per evolution range, incl. reasoning/thinking (K)', fmt: r => r.out_tok_k ? String(Math.round(r.out_tok_k)) : '—' },
    { key: 'time_h',    label: 'Time h',      num: true, dir: 'min', tip: 'Average wall-clock time per evolution range (hours)', fmt: r => r.time_h ? r.time_h.toFixed(2) : '—' },
    { key: 'turns',     label: 'Turns',       num: true, dir: 'min', tip: 'Average agent turns per evolution range', fmt: r => r.turns ? String(Math.round(r.turns)) : '—' },
  ];

  const LB_TOP3 = {};
  LB_COLS.forEach(c => {
    if (!c.num || !c.dir) return;
    const valid = RECORDS.filter(r => r[c.key] != null && r[c.key] > 0);
    valid.sort((a, b) => c.dir === 'max' ? b[c.key] - a[c.key] : a[c.key] - b[c.key]);
    const m = {};
    valid.slice(0, 3).forEach((r, i) => { m[r.id] = i + 1; });
    LB_TOP3[c.key] = m;
  });

  let lbKey = 'score', lbDesc = true;

  function lbRender() {
    const head = document.getElementById('lb-head');
    const body = document.getElementById('lb-body');
    if (!head || !body) return;

    head.innerHTML = LB_COLS.map(c => {
      const active = c.key === lbKey;
      const arrow = active ? (lbDesc ? '↓' : '↑') : '';
      const centered = c.key !== 'model';
      const cls = 'sortable' + (c.num ? ' num' : '') + (centered ? ' ctr' : '') +
        (c.hero ? ' keycol' : '') + (active ? ' active' : '');
      const tip = c.tip ? ' data-tip="' + c.tip + '"' : '';
      return '<th class="' + cls + '" data-key="' + c.key + '"' + tip + '>' + c.label +
        '<span class="sarrow">' + arrow + '</span></th>';
    }).join('');

    const dir = lbDesc ? -1 : 1;
    const sorted = RECORDS.slice().sort((a, b) => {
      if (lbKey === 'model') return dir * a.model_display.localeCompare(b.model_display);
      return dir * (a[lbKey] - b[lbKey]);
    });

    body.innerHTML = sorted.map(r => {
      const top = r.rank === 1 ? ' class="top"' : '';
      const cells = LB_COLS.map(c => {
        if (c.key === 'rank') {
          const medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : '';
          return '<td class="rank ctr">' + (medal ? '<span class="rank-medal">' + medal + '</span>' : r.rank) + '</td>';
        }
        if (c.key === 'model') {
          const uri = LOGOS[r.logo_key];
          const mark = uri
            ? '<img class="m-logo" src="' + uri + '" alt="">'
            : '<span class="m-dot" style="background:' + r.color + '"></span>';
          return '<td class="model"><span class="m-name">' + mark + r.model_display +
            '</span><span class="m-scaffold">' + r.agent_display + '</span></td>';
        }
        const pos = LB_TOP3[c.key] && LB_TOP3[c.key][r.id];
        if (c.key === 'score') {
          const w = Math.max(2, Math.min(100, Math.round(r.score)));
          return '<td class="score-cell"><span class="scorebar"><i style="width:' + w + '%"></i>' +
            '<span class="scoreval">' + c.fmt(r) + '</span></span></td>';
        }
        const cls = 'num ctr' + (c.hero ? ' keycol' : '') + (pos ? ' t' + pos : '');
        return '<td class="' + cls + '">' + c.fmt(r) + '</td>';
      }).join('');
      return '<tr' + top + '>' + cells + '</tr>';
    }).join('');

    head.querySelectorAll('th').forEach(th => {
      th.addEventListener('click', () => {
        const k = th.getAttribute('data-key');
        if (k === lbKey) lbDesc = !lbDesc;
        else { lbKey = k; lbDesc = (k !== 'rank' && k !== 'model'); }
        lbRender();
      });
    });
  }
  lbRender();

  // header hover explanations — delegated so it survives header re-renders
  (function () {
    const tip = document.createElement('div');
    tip.className = 'tip-popup';
    document.body.appendChild(tip);
    document.addEventListener('mouseover', function (e) {
      const el = e.target.closest ? e.target.closest('[data-tip]') : null;
      if (!el) return;
      tip.textContent = el.getAttribute('data-tip');
      const r = el.getBoundingClientRect();
      tip.style.left = (r.left + r.width / 2) + 'px';
      tip.style.top = (r.top - 8) + 'px';
      tip.classList.add('show');
    });
    document.addEventListener('mouseout', function (e) {
      const el = e.target.closest ? e.target.closest('[data-tip]') : null;
      if (el && !el.contains(e.relatedTarget)) tip.classList.remove('show');
    });
  })();
})();
</script>
</body>
</html>
